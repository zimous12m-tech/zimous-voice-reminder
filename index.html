<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zimous Voice Reminder v2.1</title>
    
    <!-- Meta Tags para partilha bonita com a imagem gerada -->
    <meta property="og:title" content="Zimous Voice Reminder 🎙️ | O Seu Assistente de Voz Inteligente">
    <meta property="og:description" content="Organize tarefas e grave notas de voz diretamente no telemóvel. Sem instalar nada, rápido e 100% privado!">
    <meta property="og:image" content="https://raw.githubusercontent.com/zimous12m-tech/zimous-voice-reminder/main/capa.png">
    <meta property="og:url" content="https://zimous12m-tech.github.io/zimous-voice-reminder/">
    <meta property="og:type" content="website">

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50 px-4 py-4 shadow-lg">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <span class="text-2xl">🎙️</span>
                <div>
                    <h1 class="font-bold text-lg text-indigo-400">Zimous Voice Reminder</h1>
                    <p class="text-xs text-slate-400">Versão Web Universal (Android & iOS)</p>
                </div>
            </div>
            <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                <span class="w-2 h-2 mr-1.5 bg-emerald-500 rounded-full animate-pulse"></span> Sistema Ativo
            </span>
        </div>
    </header>

    <!-- Modal de Alarme Disparado -->
    <div id="alarmModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-indigo-500/50 rounded-2xl max-w-md w-full p-6 shadow-2xl text-center space-y-4 animate-bounce">
            <div class="text-4xl">🚨</div>
            <h2 class="text-xl font-bold text-indigo-400">Alarme de Lembrete!</h2>
            <p id="alarmTaskDesc" class="text-slate-200 text-sm font-medium"></p>
            <div id="alarmAudioContainer"></div>
            <button onclick="dismissAlarm()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-xl transition cursor-pointer">
                Compreendido / Fechar Alarme
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <main class="flex-grow max-w-4xl w-full mx-auto px-4 py-6 space-y-6">
        
        <!-- Cartão de Criação de Lembrete -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl">
            <h2 class="text-md font-semibold text-slate-200 mb-4 flex items-center gap-2">
                <span>⚡</span> Criar Novo Lembrete com Voz
            </h2>
            <form id="taskForm" onsubmit="handleAddTask(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Descrição / Título do Lembrete</label>
                    <input type="text" id="taskDesc" required placeholder="Ex: Enviar relatório ao chefe às 18h..." 
                           class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Data e Hora de Início</label>
                        <input type="datetime-local" id="taskTime" required
                               class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Prioridade</label>
                        <select id="taskPriority" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="media">Média</option>
                            <option value="alta">Alta</option>
                            <option value="baixa">Baixa</option>
                        </select>
                    </div>
                </div>

                <!-- Gravador de Voz Integrado no Navegador -->
                <div class="bg-slate-950 border border-slate-800 rounded-xl p-4 space-y-3">
                    <label class="block text-xs font-medium text-slate-400">Nota de Voz (Microfone do Telemóvel)</label>
                    <div class="flex flex-wrap items-center gap-3">
                        <button type="button" id="recordBtn" onclick="toggleRecording()" class="flex items-center gap-2 bg-red-600 hover:bg-red-500 text-white px-4 py-2 rounded-xl text-xs font-medium transition duration-200 shadow-lg cursor-pointer">
                            <span>🎙️</span> <span id="recordText">Gravar Áudio</span>
                        </button>
                        <span id="recordStatus" class="text-xs text-slate-400">Toque para gravar a sua voz diretamente</span>
                    </div>
                    <audio id="audioPreview" controls class="hidden mt-2 h-10 w-full"></audio>
                </div>

                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-xl transition duration-200 shadow-lg shadow-indigo-600/20 text-sm cursor-pointer">
                    Guardar Lembrete no Telemóvel
                </button>
            </form>
        </div>

        <!-- Lista de Tarefas -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl">
            <h2 class="text-md font-semibold text-slate-200 mb-4 flex items-center gap-2">
                <span>📋</span> Os Seus Lembretes Guardados
            </h2>
            <div id="tasksContainer" class="space-y-3">
                <!-- As tarefas entram aqui dinamicamente -->
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-xs text-slate-500 border-t border-slate-900">
        Zimous Voice Reminder &bull; Dados armazenados com segurança no seu próprio navegador
    </footer>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;
        let recordedAudioBase64 = "";
        let activeAlarmAudio = null;

        // Preencher data atual por defeito e iniciar o vigilante de alarmes
        document.addEventListener("DOMContentLoaded", () => {
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('taskTime').value = now.toISOString().slice(0,16);
            loadTasks();

            // Verificar alarmes a cada segundo
            setInterval(checkAlarms, 1000);
        });

        async function toggleRecording() {
            const btn = document.getElementById('recordBtn');
            const txt = document.getElementById('recordText');
            const status = document.getElementById('recordStatus');
            const preview = document.getElementById('audioPreview');

            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
                    mediaRecorder.onstop = async () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = function() {
                            recordedAudioBase64 = reader.result;
                            preview.src = URL.createObjectURL(audioBlob);
                            preview.classList.remove('hidden');
                        };
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    btn.classList.replace('bg-red-600', 'bg-amber-600');
                    txt.textContent = 'Parar Gravação';
                    status.textContent = 'Gravando... fale agora.';
                    status.classList.add('text-red-400', 'animate-pulse');
                } catch (err) {
                    alert('Erro ao aceder ao microfone. Verifique as permissões do seu navegador.');
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                btn.classList.replace('bg-amber-600', 'bg-red-600');
                txt.textContent = 'Gravar Novamente';
                status.textContent = 'Áudio gravado com sucesso!';
                status.classList.remove('text-red-400', 'animate-pulse');
                status.classList.add('text-emerald-400');
            }
        }

        function getTasks() {
            return JSON.parse(localStorage.getItem('zimous_tasks') || '[]');
        }

        function saveTasks(tasks) {
            localStorage.setItem('zimous_tasks', JSON.stringify(tasks));
        }

        function handleAddTask(event) {
            event.preventDefault();
            const desc = document.getElementById('taskDesc').value;
            const time = document.getElementById('taskTime').value;
            const priority = document.getElementById('taskPriority').value;

            const newTask = {
                id: Date.now(),
                description: desc,
                start_at: time,
                priority: priority,
                status: 'pendente',
                audio: recordedAudioBase64,
                alerted: false
            };

            const tasks = getTasks();
            tasks.push(newTask);
            saveTasks(tasks);

            // Limpar formulário
            document.getElementById('taskForm').reset();
            recordedAudioBase64 = "";
            document.getElementById('audioPreview').classList.add('hidden');
            document.getElementById('recordStatus').textContent = 'Toque para gravar a sua voz diretamente';
            
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('taskTime').value = now.toISOString().slice(0,16);

            loadTasks();
        }

        function updateStatus(id, newStatus) {
            let tasks = getTasks();
            tasks = tasks.map(t => t.id === id ? {...t, status: newStatus} : t);
            saveTasks(tasks);
            loadTasks();
        }

        function deleteTask(id) {
            let tasks = getTasks();
            tasks = tasks.filter(t => t.id !== id);
            saveTasks(tasks);
            loadTasks();
        }

        // Sistema de verificação de tempo e disparo de alarme
        function checkAlarms() {
            const tasks = getTasks();
            const now = new Date();
            let updated = false;

            tasks.forEach(t => {
                if (t.status === 'pendente' && !t.alerted) {
                    const taskTime = new Date(t.start_at);
                    if (now >= taskTime) {
                        t.alerted = true;
                        updated = true;
                        triggerAlarmModal(t);
                    }
                }
            });

            if (updated) {
                saveTasks(tasks);
                loadTasks();
            }
        }

        function triggerAlarmModal(task) {
            document.getElementById('alarmTaskDesc').textContent = task.description;
            const audioContainer = document.getElementById('alarmAudioContainer');
            
            if (task.audio) {
                audioContainer.innerHTML = `<audio id="modalAudio" controls autoplay class="w-full mt-2"><source src="${task.audio}" type="audio/webm"></audio>`;
                activeAlarmAudio = document.getElementById('modalAudio');
            } else {
                audioContainer.innerHTML = '<p class="text-xs text-slate-400">Nenhuma nota de voz associada.</p>';
                activeAlarmAudio = null;
            }

            document.getElementById('alarmModal').classList.remove('hidden');
        }

        function dismissAlarm() {
            if (activeAlarmAudio) {
                activeAlarmAudio.pause();
                activeAlarmAudio.currentTime = 0;
            }
            document.getElementById('alarmModal').classList.add('hidden');
        }

        function loadTasks() {
            const container = document.getElementById('tasksContainer');
            const tasks = getTasks();

            if (tasks.length === 0) {
                container.innerHTML = '<div class="text-center py-8 text-slate-500 text-sm">Nenhum lembrete registado neste telemóvel.</div>';
                return;
            }

            tasks.sort((a, b) => new Date(a.start_at) - new Date(b.start_at));

            container.innerHTML = '';
            tasks.forEach(t => {
                const badgeColors = {
                    'pendente': 'bg-amber-500/10 text-amber-400 border-amber-500/20',
                    'assumida': 'bg-blue-500/10 text-blue-400 border-blue-500/20',
                    'concluida': 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20'
                }[t.status] || 'bg-slate-500/10 text-slate-400 border-slate-500/20';

                let audioHtml = t.audio ? `<audio controls class="mt-2 h-8 w-full"><source src="${t.audio}" type="audio/webm"></audio>` : '';

                container.innerHTML += `
                <div class="bg-slate-950 border border-slate-800/80 rounded-xl p-4 flex flex-col gap-2">
                    <div class="flex items-center justify-between">
                        <h3 class="text-sm font-medium text-slate-100">${t.description}</h3>
                        <span class="px-2.5 py-0.5 rounded-lg text-xs border ${badgeColors}">Estado: ${t.status}</span>
                    </div>
                    <div class="flex items-center gap-4 text-xs text-slate-400 flex-wrap">
                        <span>📅 Início: ${t.start_at.replace('T', ' ')}</span>
                        <span>⚡ Prioridade: ${t.priority}</span>
                    </div>
                    ${audioHtml}
                    <div class="flex flex-wrap items-center gap-2 mt-3 pt-3 border-t border-slate-800/60 text-xs">
                        <button onclick="updateStatus(${t.id}, 'assumida')" class="px-3 py-1.5 bg-blue-600/20 hover:bg-blue-600/40 text-blue-300 rounded-lg border border-blue-500/30 transition cursor-pointer">Assumir</button>
                        <button onclick="updateStatus(${t.id}, 'concluida')" class="px-3 py-1.5 bg-emerald-600/20 hover:bg-emerald-600/40 text-emerald-300 rounded-lg border border-emerald-500/30 transition cursor-pointer">Concluir</button>
                        <button onclick="deleteTask(${t.id})" class="px-3 py-1.5 bg-red-600/20 hover:bg-red-600/40 text-red-300 rounded-lg border border-red-500/30 transition ml-auto cursor-pointer">Eliminar</button>
                    </div>
                </div>`;
            });
        }
    </script>
</body>
                            </html>
